<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Notification System</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="background"></div>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left-section">

            <h1>Cloud Notification System</h1>

            <p>
                Send real-time Email and SMS notifications instantly using
                AWS Lambda, API Gateway, SNS and SQS integration.
            </p>

            <div class="features">

                <div class="feature-card">
                    ⚡ Real-Time Notification Delivery
                </div>

                <div class="feature-card">
                    ☁️ Cloud Powered Architecture
                </div>

                <div class="feature-card">
                    🔒 Secure & Scalable System
                </div>

            </div>

        </div>


        <!-- RIGHT SECTION -->

        <div class="form-section">

            <div class="form-card">

                <h2>Send Notification</h2>

                <!-- TYPE -->

                <div class="input-group">

                    <label>Notification Type</label>

                    <select id="type">

                        <option value="email">Email</option>

                        <option value="sms">SMS</option>

                    </select>

                </div>


                <!-- EMAIL -->

                <div class="input-group" id="emailGroup">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >

                </div>


                <!-- PHONE -->

                <div
                    class="input-group"
                    id="phoneGroup"
                    style="display:none;"
                >

                    <label>Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <!-- MESSAGE -->

                <div class="input-group">

                    <label>Notification Message</label>

                    <textarea
                        id="message"
                        placeholder="Type your message here..."
                    ></textarea>

                </div>


                <!-- BUTTON -->

                <button onclick="sendNotification()">
                    Send Notification
                </button>


                <!-- RESULT -->

                <p id="result"></p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
